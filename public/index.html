<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Account Inbox Mailer</title>
  <link rel="stylesheet" href="style.css">
  <!-- Cloudflare Turnstile Script -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <!-- Authentication Overlay -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h2>🔒 Enter Site Password</h2>
      <form id="loginForm">
        <input type="password" id="sitePassword" placeholder="Enter Password" required>
        <button type="submit">Access Mailer</button>
      </form>
    </div>
  </div>

  <!-- Main Mailer Section -->
  <div id="mailerSection" class="main-container" style="display: none;">
    <header>
      <h1>🚀 Multi-Account Inbox Streamer</h1>
      <p>Rotate multiple Gmail accounts to safely scale your outreach delivery.</p>
    </header>

    <!-- Sender Accounts Section -->
    <div class="section-card">
      <h3>1. Sender Gmail Accounts (Rotation Pool)</h3>
      <div id="accountsContainer">
        <!-- Default Initial Account Row -->
        <div class="account-row">
          <input type="email" placeholder="sender@gmail.com" class="acc-email" required>
          <input type="password" placeholder="16-Char App Password" class="acc-pass" required>
          <input type="text" placeholder="Sender Name (Optional)" class="acc-name">
          <button type="button" class="remove-btn" style="display:none;">✕</button>
        </div>
      </div>
      <button type="button" id="addAccountBtn" class="secondary-btn">+ Add Another Gmail</button>
      <button type="button" id="verifyBtn" class="primary-btn" style="margin-top: 10px;">Verify All Accounts</button>
    </div>

    <!-- Campaign Details Section -->
    <div class="section-card">
      <h3>2. Email Campaign Details</h3>
      <div class="input-group">
        <label>Subject (Spintax Supported e.g. {Hi|Hello} {Name})</label>
        <input type="text" id="subject" placeholder="Enter email subject...">
      </div>
      <div class="input-group">
        <label>Message Body (HTML or Plain Text with Spintax)</label>
        <textarea id="messageBody" rows="6" placeholder="Type your message here... Use {Name}, {FirstName}, {Email}"></textarea>
      </div>
    </div>

    <!-- Recipients Section -->
    <div class="section-card">
      <h3>3. Recipients (One per line)</h3>
      <textarea id="recipients" rows="6" placeholder="recipient@domain.com&#10;John Doe <john@domain.com>"></textarea>
    </div>

    <!-- Turnstile Widget -->
    <div class="section-card" style="text-align: center;">
      <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
    </div>

    <!-- Actions -->
    <div class="actions-container">
      <button type="button" id="sendBtn" class="success-btn">Start Sending Stream</button>
      <button type="button" id="stopBtn" class="danger-btn" style="display: none;">Stop Sending</button>
    </div>

    <!-- Live Logs Section -->
    <div class="section-card">
      <h3>📊 Live Dispatch Logs</h3>
      <div id="logsContainer" class="logs-box"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
