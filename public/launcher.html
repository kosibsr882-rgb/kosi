<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fast Mailer - Send Email</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>Send Email</h2>
    <form id="emailForm">
      <input type="text" id="senderName" placeholder="Your Name" />
      <input type="email" id="gmailId" placeholder="Gmail ID" required />
      <input type="password" id="appPassword" placeholder="App Password" required />
      <input type="text" id="to" placeholder="Recipient Email" required />
      <input type="text" id="subject" placeholder="Subject" required />
      <textarea id="messageBody" placeholder="Message" required></textarea>
      <button type="submit">Send Email</button>
    </form>
    <button id="logoutBtn">Logout</button>
    <p id="statusMsg"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
