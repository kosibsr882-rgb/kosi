<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast Mailer Launcher</title>
</head>
<body>
  <h2>Send Email</h2>
  <form id="emailForm">
    <input type="text" name="senderName" placeholder="Sender Name"><br>
    <input type="email" name="gmailId" placeholder="Your Gmail ID" required><br>
    <input type="password" name="appPassword" placeholder="App Password" required><br>
    <input type="email" name="to" placeholder="Recipient Email" required><br>
    <input type="text" name="subject" placeholder="Subject" required><br>
    <textarea name="messageBody" placeholder="Message" required></textarea><br>
    <button type="submit">Send</button>
  </form>
  <button id="logoutBtn">Logout</button>

  <script>
    let lastSend = 0;
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastSend < 1000) {
        alert("⚠️ Please wait 1 second before sending another email.");
        return;
      }
      lastSend = now;

      const formData = new FormData(e.target);
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(formData))
      });
      const data = await res.json();
      alert(data.success ? '✅ Email sent!' : '❌ ' + data.message);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
