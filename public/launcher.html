<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer</title>
</head>
<body>
  <h2>Send Email</h2>
  <form id="mailForm">
    <input type="text" name="senderName" placeholder="Sender Name"><br>
    <input type="email" name="gmailId" placeholder="Your Gmail ID" required><br>
    <input type="password" name="appPassword" placeholder="App Password" required><br>
    <input type="text" name="to" placeholder="Recipient Email" required><br>
    <input type="text" name="subject" placeholder="Subject"><br>
    <textarea name="messageBody" placeholder="Message" required></textarea><br>
    <button type="submit">Send</button>
  </form>
  <script>
    document.getElementById('mailForm').addEventListener('submit', async e => {
      e.preventDefault();
      const res = await fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          senderName: e.target.senderName.value,
          gmailId: e.target.gmailId.value,
          appPassword: e.target.appPassword.value,
          to: e.target.to.value,
          subject: e.target.subject.value,
          messageBody: e.target.messageBody.value
        })
      });
      const data = await res.json();
      if (data.success) alert('✅ Email sent!');
      else alert('❌ ' + data.message);
    });
  </script>
</body>
</html>
