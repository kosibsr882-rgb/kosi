<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer Launcher</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Send HTML Email</h2>
    <input type="text" id="senderName" placeholder="Sender Name (optional)">
    <input type="text" id="gmailId" placeholder="Your Gmail ID">
    <input type="password" id="appPassword" placeholder="App Password">
    <input type="text" id="to" placeholder="Recipient Email">
    <input type="text" id="subject" placeholder="Subject">
    <textarea id="htmlBody" placeholder="Write your message here (HTML supported)"></textarea>
    <button onclick="sendHtml()">Send HTML Email</button>
    <button onclick="logout()">Logout</button>
    <p id="msg"></p>
  </div>
  <script src="script.js"></script>
  <script>
    async function logout() {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
</body>
</html>
