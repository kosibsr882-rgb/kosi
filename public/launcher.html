<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer Launcher</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; background:#eef; padding:20px; }
    input, textarea { display:block; margin:10px 0; padding:10px; width:100%; }
    button { padding:10px; background:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    #logoutBtn { background:#dc3545; margin-top:20px; }
  </style>
</head>
<body>
  <h2>Send Email</h2>
  <input type="text" id="senderName" placeholder="Sender Name (optional)">
  <input type="text" id="gmailId" placeholder="Your Gmail ID">
  <input type="password" id="appPassword" placeholder="App Password">
  <input type="text" id="to" placeholder="Recipient Email">
  <input type="text" id="subject" placeholder="Subject">
  <textarea id="messageBody" placeholder="Message Body"></textarea>
  <button onclick="sendEmail()">Send Email</button>
  <button id="logoutBtn">Logout</button>
  <p id="msg"></p>

  <script>
    async function sendEmail() {
      const payload = {
        senderName: document.getElementById('senderName').value,
        gmailId: document.getElementById('gmailId').value,
        appPassword: document.getElementById('appPassword').value,
        to: document.getElementById('to').value,
        subject: document.getElementById('subject').value,
        messageBody: document.getElementById('messageBody').value
      };
      const res = await fetch('/api/send-email', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('msg').innerText = data.success ? '✅ Email sent!' : '❌ ' + data.message;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
