<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer Launcher</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Send Email to 25 Recipients</h2>
    <input type="text" id="senderName" placeholder="Sender Name (optional)">
    <input type="text" id="gmailId" placeholder="Your Gmail ID">
    <input type="password" id="appPassword" placeholder="Your Gmail App Password">
    <input type="text" id="subject" placeholder="Subject">
    <textarea id="messageBody" placeholder="Message Body"></textarea>
    <textarea id="recipients" placeholder="Enter up to 25 emails, comma separated"></textarea>
    <button onclick="send25()">Send to 25</button>
    <button onclick="logout()">Logout</button>
    <p id="msg"></p>
  </div>
  <script src="script.js"></script>
  <script>
    async function logout() {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
</body>
</html>
