<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer - Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2><b>Send Email</b></h2>
    <form id="emailForm">
      <input type="text" name="senderName" placeholder="Sender Name">
      <input type="email" name="gmailId" placeholder="Your Gmail ID" required>
      <input type="password" name="appPassword" placeholder="App Password" required>
      <input type="email" name="to" placeholder="Recipient Email" required>
      <input type="text" name="subject" placeholder="Subject" required>
      <textarea name="messageBody" placeholder="Message" rows="5" required></textarea>
      <button type="submit"><b>Send Email</b></button>
    </form>
    <button id="logoutBtn"><b>Logout</b></button>
    <p id="emailMessage"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
