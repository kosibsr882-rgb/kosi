<!DOCTYPE html>
<html>
<head>
  <title>Fast Mailer - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; }
    .container { width:400px; margin:100px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; font-size:28px; font-weight:bold; }
    input, button { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:5px; font-size:16px; }
    button { background:#007bff; color:#fff; font-size:18px; font-weight:bold; cursor:pointer; }
    button:hover { background:#0056b3; }
    p { text-align:center; font-weight:bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = loginForm.username.value;
      const password = loginForm.password.value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (data.success) {
        window.location.href = '/launcher';
      } else {
        document.getElementById('loginMessage').textContent = data.message;
      }
    });
  </script>
</body>
</html>
