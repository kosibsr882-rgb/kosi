<!DOCTYPE html>
<html>
<head>
  <title>Login - Fast Mailer</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; background: #f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }
    .box { background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    input { display:block; margin:10px 0; padding:10px; width:100%; }
    button { padding:10px; width:100%; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>
  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username,password})
      });
      const data = await res.json();
      if(data.success) window.location.href='/launcher';
      else document.getElementById('msg').innerText = data.message;
    }
  </script>
</body>
</html>
